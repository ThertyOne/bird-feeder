[env:esp32cam]
platform = espressif32@6.4.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM9

lib_deps =
    ArduinoJson@^6.21.0
    UniversalTelegramBot @ 1.3.0

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

upload_protocol = esptool